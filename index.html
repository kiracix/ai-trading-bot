<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Crypto Bot</title>

<style>

body{
margin:0;
background:#07111d;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

h1{
text-align:center;
}

.status{
text-align:center;
padding:12px;
margin:15px 0;
background:#102238;
border-radius:10px;
}

.coins{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

button{
padding:14px;
border:0;
border-radius:10px;
background:#1265d5;
color:white;
font-size:16px;
font-weight:bold;
}

#sonuc{
margin-top:20px;
padding:20px;
background:#0d1b2a;
border-radius:15px;
text-align:center;
}

</style>

</head>

<body>

<h1>🧠 AI Crypto Bot</h1>

<div class="status" id="durum">
Sistem hazır
</div>

<div class="coins" id="coins"></div>

<div id="sonuc">
Bir coin seç.
</div>


<script>

const coinler = [

"LUNC",
"BTC",
"ETH",
"XRP",
"SOL",
"XLM",
"XDC",
"RIZO",
"XPR",
"USTC",
"PENGU",
"MON",
"MANYU",
"KEKIUS",
"VANRY",
"REEF",
"PEPE",
"BABYDOGE",
"SHIB",
"FLOKI",
"BONK"

];


function coinleriOlustur(){

const alan =
document.getElementById("coins");

alan.innerHTML="";

coinler.forEach(function(coin){

const buton =
document.createElement("button");

buton.innerText=coin;

buton.onclick=function(){

coinSec(coin);

};

alan.appendChild(buton);

});

document.getElementById("durum").innerText=
"🟢 Sistem hazır — "+coinler.length+" coin yüklendi";

}


function coinSec(coin){

document.getElementById("sonuc").innerHTML=

"<h2>"+coin+"</h2>"+
"<p>Coin seçildi.</p>"+
"<p>Gerçek fiyat verisi bir sonraki aşamada bağlanacak.</p>";

}


coinleriOlustur();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Crypto Bot</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#07111d;
    color:white;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
}

#durum{
    text-align:center;
    background:#102238;
    padding:15px;
    border-radius:10px;
    margin:15px 0;
}

#coins{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

button{
    padding:15px;
    border:0;
    border-radius:10px;
    background:#1265d5;
    color:white;
    font-size:16px;
    font-weight:bold;
}

#sonuc{
    margin-top:20px;
    padding:20px;
    background:#0d1b2a;
    border-radius:15px;
    text-align:center;
}
</style>
</head>

<body>

<h1>🧠 AI Crypto Bot</h1>

<div id="durum">
Sistem başlatılıyor...
</div>

<div id="coins"></div>

<div id="sonuc">
Bir coin seç.
</div>

<script>

const coinler = [
"LUNC",
"BTC",
"ETH",
"XRP",
"SOL",
"XLM",
"XDC",
"RIZO",
"XPR",
"USTC",
"PENGU",
"MON",
"MANYU",
"KEKIUS",
"VANRY",
"REEF",
"PEPE",
"BABYDOGE",
"SHIB",
"FLOKI",
"BONK"
];

const coins = document.getElementById("coins");
const durum = document.getElementById("durum");
const sonuc = document.getElementById("sonuc");

coinler.forEach(function(coin){

    const buton = document.createElement("button");

    buton.textContent = coin;

    buton.onclick = function(){

        sonuc.innerHTML =
        "<h2>" + coin + "</h2>" +
        "<p>Coin seçildi ✅</p>";

    };

    coins.appendChild(buton);

});

durum.textContent =
"🟢 Sistem hazır — " + coinler.length + " coin yüklendi";

</script>

</body>
</html>

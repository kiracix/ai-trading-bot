<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coin Analiz Terminali V4</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>COIN ANALİZ TERMİNALİ V4</h1>

        <div id="connectionStatus">
            Bağlanıyor...
        </div>
    </header>

    <section class="stats">

        <div class="stat-box">
            <span>Aktif Coin</span>
            <strong id="activeCoins">0</strong>
        </div>

        <div class="stat-box">
            <span>Mesaj</span>
            <strong id="totalMessages">0</strong>
        </div>

        <div class="stat-box">
            <span>Trade</span>
            <strong id="totalTrades">0</strong>
        </div>

        <div class="stat-box">
            <span>Order Book</span>
            <strong id="totalBooks">0</strong>
        </div>

    </section>

    <section class="terminal">

        <div class="terminal-header">
            <h2>GERÇEK ZAMANLI PİYASA</h2>

            <input
                id="coinSearch"
                type="text"
                placeholder="Coin ara..."
            >
        </div>

        <div class="table-wrapper">

            <table id="coinTable">

                <thead>
                    <tr>
                        <th>Coin</th>
                        <th>Fiyat</th>
                        <th>Momentum</th>
                        <th>Sinyal</th>
                        <th>Skor</th>
                        <th>Alış Baskısı</th>
                        <th>Trade</th>
                    </tr>
                </thead>

                <tbody>
                </tbody>

            </table>

        </div>

    </section>

    <section class="details">

        <div class="detail-card">

            <h2>Seçili Coin</h2>

            <div id="detailPrice">
                -
            </div>

            <div id="bigSignal">
                WAIT
            </div>

            <div id="signalScore">
                Skor: 50 / 100
            </div>

        </div>

        <div class="orderbook">

            <div class="book-column">

                <h3>ALIM</h3>

                <div id="bids">
                </div>

            </div>

            <div class="book-column">

                <h3>SATIŞ</h3>

                <div id="asks">
                </div>

            </div>

        </div>

    </section>

    <section class="logs">

        <h2>Sistem Günlüğü</h2>

        <div id="log">
        </div>

    </section>

</div>

<!-- GERÇEK ZAMANLI ANALİZ MOTORU -->
<script src="app.js"></script>

</body>
</html>
